name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      remove_tag:
        description: "Delete this release and its tag (for example v0.3.0) and stop, without building"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  remove:
    if: github.event_name == 'workflow_dispatch' && inputs.remove_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.remove_tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.\-]*$ ]] || { echo "::error::'$TAG' doesn't look like a version tag"; exit 1; }
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

  release:
    if: github.event_name != 'workflow_dispatch' || inputs.remove_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$V"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/*.apk "haze-${{ steps.ver.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gallery-signed-apk
          path: haze-*.apk

      # Started by hand: replace any release that already uses this version, so the tag moves to this build.
      - name: Replace an existing release with the same tag
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Haze ${{ steps.ver.outputs.tag }}
          files: haze-*.apk
          generate_release_notes: true
